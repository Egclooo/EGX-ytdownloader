<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Downloader Updater</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="updater">
      <header class="hero">
        <div>
          <p class="eyebrow">GitHub updater</p>
          <h1>YT Downloader</h1>
        </div>
        <span id="stateBadge" class="state-badge">Starting</span>
      </header>

      <section class="status" id="statusPanel">
        <div class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          <strong id="statusText">Preparing update check...</strong>
          <span id="percentText">0%</span>
        </div>
        <div class="progress" aria-hidden="true">
          <div id="progressBar"></div>
        </div>
        <div class="steps" aria-hidden="true">
          <span data-step="fetch">Fetch</span>
          <span data-step="compare">Compare</span>
          <span data-step="pull">Pull</span>
          <span data-step="finish">Finish</span>
        </div>
      </section>

      <section class="detail-panel">
        <div class="detail-header">
          <strong>Details</strong>
          <span id="repoText"></span>
        </div>
        <pre id="detailText" class="detail"></pre>
      </section>

      <footer>
        <button id="closeButton" type="button" disabled>Close</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
