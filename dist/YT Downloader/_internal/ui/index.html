<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Local downloader</p>
            <h1>YT Downloader</h1>
          </div>
          <button id="folderButton" class="folder-button" type="button">
            <span class="folder-icon" aria-hidden="true"></span>
            <span>Folder</span>
          </button>
        </div>

        <form id="downloadForm" class="form" novalidate>
          <label class="field url-field" id="urlField">
            <span>YouTube URL</span>
            <input
              id="urlInput"
              type="text"
              placeholder="https://www.youtube.com/watch?v=..."
              autocomplete="off"
              spellcheck="false"
              aria-describedby="urlError"
            />
            <small id="urlError" class="field-error"></small>
          </label>

          <div class="controls">
            <fieldset>
              <legend>Format</legend>
              <div class="segmented" role="group" aria-label="Format">
                <label>
                  <input type="radio" name="format" value="mp4" checked />
                  <span>MP4</span>
                </label>
                <label>
                  <input type="radio" name="format" value="mp3" />
                  <span>MP3</span>
                </label>
              </div>
            </fieldset>

            <label class="field compact" id="qualityField">
              <span>Video quality</span>
              <select id="qualitySelect" class="native-select" aria-hidden="true" tabindex="-1">
                <option value="1080">HD 1080p</option>
                <option value="720">HD 720p</option>
                <option value="best">Best available</option>
              </select>
              <div class="custom-select" id="qualityDropdown">
                <button
                  id="qualityButton"
                  class="select-button"
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span id="qualityButtonText">HD 1080p</span>
                  <span class="chevron" aria-hidden="true"></span>
                </button>
                <div class="select-menu" role="listbox" aria-label="Video quality">
                  <button type="button" role="option" data-value="1080" aria-selected="true">
                    <span>HD 1080p</span>
                    <small>Sharp default</small>
                  </button>
                  <button type="button" role="option" data-value="720" aria-selected="false">
                    <span>HD 720p</span>
                    <small>Smaller file</small>
                  </button>
                  <button type="button" role="option" data-value="best" aria-selected="false">
                    <span>Best available</span>
                    <small>Highest source</small>
                  </button>
                </div>
              </div>
            </label>
          </div>

          <button id="downloadButton" class="primary" type="submit">
            <span>Start download</span>
          </button>
        </form>

        <section class="status" aria-live="polite">
          <div class="status-line">
            <div class="status-copy">
              <span class="status-dot" aria-hidden="true"></span>
              <strong id="statusText">Ready</strong>
            </div>
            <span id="percentText">0%</span>
          </div>
          <div class="progress" aria-hidden="true">
            <div id="progressBar"></div>
          </div>
          <div class="meta">
            <span id="speedText"></span>
            <span id="etaText"></span>
          </div>
          <p id="fileText" class="file"></p>
        </section>
      </section>

      <aside class="side">
        <div>
          <p class="eyebrow">Output</p>
          <h2>Downloads</h2>
        </div>
        <p id="folderText" class="folder-path"></p>
        <div class="notice" id="ffmpegNotice" hidden>
          FFmpeg is not on PATH. MP3 conversion and best MP4 merging may fail.
        </div>
        <section class="history">
          <div class="history-header">
            <div>
              <p class="eyebrow">History</p>
              <h2>Recent</h2>
            </div>
            <button id="clearHistoryButton" class="clear-button" type="button">
              Clear
            </button>
          </div>
          <p id="historyEmpty" class="history-empty">No downloads yet.</p>
          <div id="historyList" class="history-list"></div>
        </section>
        <p class="fineprint">
          Download only content you own, content with a license that allows it, or
          content where you have permission.
        </p>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
